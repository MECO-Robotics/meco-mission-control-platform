name: Check shared skills scripts

on:
  pull_request:
    paths:
      - "scripts/*skills*"
      - ".github/workflows/check-skills.yml"
  push:
    branches: [main, staging, "staging/**", development]
    paths:
      - "scripts/*skills*"
      - ".github/workflows/check-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-skills-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Validate optional import scripts
        run: |
          for script in scripts/check-skills-current.sh scripts/sync-skills.sh; do
            bash -n "$script"
          done

  check-skills-trusted:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Validate optional import scripts
        run: |
          for script in scripts/check-skills-current.sh scripts/sync-skills.sh; do
            bash -n "$script"
          done
